<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Supply Daily Record App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2, h3 {
            color: #0275d8;
            text-align: center;
        }
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .form-group input, .form-group select {
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            flex: 1;
            min-width: 130px;
        }
        button {
            padding: 10px 20px;
            background-color: #5cb85c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #4cae4c;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #0275d8;
            color: white;
        }
        .summary-box {
            background: #e9ecef;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            display: flex;
            justify-content: space-around;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Water Supply Daily Manager</h2>
    
    <!-- Entry Form -->
    <div class="form-group">
        <input type="date" id="entryDate">
        <input type="text" id="customerName" placeholder="Customer Name">
        <input type="number" id="cansGiven" placeholder="Diye Gaye Can (D)" oninput="calculateBalance()">
        <input type="number" id="cansReturned" placeholder="Wapas Aaye Can (L)" oninput="calculateBalance()">
        <input type="text" id="cansBalance" placeholder="Baaki Can (B)" readonly style="background-color: #e9ecef;">
        <input type="number" id="amount" placeholder="Amount (Rs.)">
        <button onclick="addEntry()">Entry Jodein</button>
    </div>

    <!-- Filter by Date -->
    <div style="margin-bottom: 15px; text-align: right;">
        <label>Tarikh ke mutabiq dekhein: </label>
        <input type="date" id="filterDate" onchange="filterTable()">
        <button onclick="resetFilter()" style="background-color: #6c757d; padding: 6px 12px; font-size: 14px;">Sabhi Dekhein</button>
    </div>

    <!-- Data Table -->
    <table>
        <thead>
            <tr>
                <th>Tarikh</th>
                <th>Customer Name</th>
                <th>Diye (D)</th>
                <th>Wapas (L)</th>
                <th>Baaki (B)</th>
                <th>Amount (Rs.)</th>
                <th>Action</th>
            </tr>
        xl>
        <tbody id="tableData">
            <!-- Entries will append here -->
        </tbody>
    </table>

    <!-- Daily Total Summary -->
    <div class="summary-box">
        <div>Total Diye Gaye Cans: <span id="totalGiven">0</span></div>
        <div>Total Wapas Aaye Cans: <span id="totalReturned">0</span></div>
        <div>Total Amount (Rs.): <span id="totalAmount">0</span></div>
    </div>
</div>

<script>
    // Set today's date by default
    document.getElementById('entryDate').valueAsDate = new Date();

    let entries = JSON.parse(localStorage.getItem('waterEntries')) || [];

    function calculateBalance() {
        let given = parseInt(document.getElementById('cansGiven').value) || 0;
        let returned = parseInt(document.getElementById('cansReturned').value) || 0;
        // Balance calculation logic can be customized (e.g., previous balance + given - returned)
        let balance = given - returned;
        document.getElementById('cansBalance').value = balance >= 0 ? balance : 0;
    }

    function addEntry() {
        let date = document.getElementById('entryDate').value;
        let name = document.getElementById('customerName').value.trim();
        let given = document.getElementById('cansGiven').value;
        let returned = document.getElementById('cansReturned').value;
        let balance = document.getElementById('cansBalance').value;
        let amount = document.getElementById('amount').value;

        if (!name || !date) {
            alert("Kripya Tarikh aur Customer ka Naam bharein!");
            return;
        }

        let entry = {
            id: Date.now(),
            date: date,
            name: name,
            given: given || '0',
            returned: returned || '0',
            balance: balance || '0',
            amount: amount || '0'
        };

        entries.push(entry);
        saveAndRender();
        clearForm();
    }

    function clearForm() {
        document.getElementById('customerName').value = '';
        document.getElementById('cansGiven').value = '';
        document.getElementById('cansReturned').value = '';
        document.getElementById('cansBalance').value = '';
        document.getElementById('amount').value = '';
    }

    function deleteEntry(id) {
        entries = entries.filter(e => e.id !== id);
        saveAndRender();
    }

    function saveAndRender() {
        localStorage.setItem('waterEntries', JSON.stringify(entries));
        renderTable(entries);
    }

    function renderTable(dataToRender) {
        let tbody = document.getElementById('tableData');
        tbody.innerHTML = '';
        
        let tGiven = 0;
        let tReturned = 0;
        let tAmount = 0;

        dataToRender.forEach(item => {
            tGiven += parseInt(item.given);
            tReturned += parseInt(item.returned);
            tAmount += parseFloat(item.amount);

            let row = `<tr>
                <td>${item.date}</td>
                <td>${item.name}</td>
                <td>${item.given}</td>
                <td>${item.returned}</td>
                <td>${item.balance}</td>
                <td>${item.amount}</td>
                <td><button onclick="deleteEntry(${item.id})" style="background-color: #d9534f; padding: 5px 10px; font-size: 12px;">Hataayein</button></td>
            </tr>`;
            tbody.innerHTML += row;
        });

        document.getElementById('totalGiven').innerText = tGiven;
        document.getElementById('totalReturned').innerText = tReturned;
        document.getElementById('totalAmount').innerText = '₹' + tAmount;
    }

    function filterTable() {
        let filterDate = document.getElementById('filterDate').value;
        if (!filterDate) return;
        let filtered = entries.filter(e => e.date === filterDate);
        renderTable(filtered);
    }

    function resetFilter() {
        document.getElementById('filterDate').value = '';
        renderTable(entries);
    }

    // Initial render on page load
    renderTable(entries);
</script>

</body>
</html>
